services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderops
      POSTGRES_PASSWORD: orderops
      POSTGRES_DB: orderops_auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderops -d orderops_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: orderops
      MONGO_INITDB_ROOT_PASSWORD: orderops
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: orderops
      RABBITMQ_DEFAULT_PASS: orderops
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: ./services/auth
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://orderops:orderops@postgres:5432/orderops_auth?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRY_HOURS: "24"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  orders:
    build:
      context: ./services/orders
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://orderops:orderops@postgres:5432/orderops_orders?sslmode=disable
      RABBITMQ_URL: amqp://orderops:orderops@rabbitmq:5672/
      JWT_SECRET: local-dev-secret-change-me
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mongodata:
  rabbitmqdata:
